# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  # temporarily relaxed for debugging the "Expired goal" issue: MoveIt's own
  # execution-duration monitor was giving up before motoros2 ever responded.
  allowed_execution_duration_scaling: 10.0
  allowed_goal_duration_margin: 5.0
  execution_duration_monitoring: false

moveit_simple_controller_manager:
  controller_names:
    - follow_joint_trajectory_queue_sender

  follow_joint_trajectory_queue_sender:
    type: FollowJointTrajectory
    action_ns: ""
    default: true
    joints:
      - group_1/joint_1
      - group_1/joint_2
      - group_1/joint_3
      - group_1/joint_4
      - group_1/joint_5
      - group_1/joint_6

