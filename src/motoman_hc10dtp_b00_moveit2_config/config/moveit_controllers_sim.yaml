# Simulation-only controller mapping: targets the joint_trajectory_controller spawned by
# motoman_hc10_support/launch/gazebo.launch.py instead of a real MotoROS2 controller.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - joint_trajectory_controller

  joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - group_1_joint_1
      - group_1_joint_2
      - group_1_joint_3
      - group_1_joint_4
      - group_1_joint_5
      - group_1_joint_6
