controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - group_1_joint_1
      - group_1_joint_2
      - group_1_joint_3
      - group_1_joint_4
      - group_1_joint_5
      - group_1_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
